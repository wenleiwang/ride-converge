# 将本文件放到 /etc/nginx/conf.d/ride-converge.conf，按实际证书路径调整后执行 nginx -t。
# DNS 需要先把 ride-converge.wenlei.wang 的 A/AAAA 记录指向服务器。

# 防止公开接口被高频调用而消耗高德配额。该指令必须位于 Nginx 的 http 上下文中。
limit_req_zone $binary_remote_addr zone=ride_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ride-converge.wenlei.wang;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ride-converge.wenlei.wang;

    ssl_certificate /etc/nginx/cert/ride-converge.wenlei.wang.pem;
    ssl_certificate_key /etc/nginx/cert/ride-converge.wenlei.wang.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128k;

    location /api/ {
        limit_req zone=ride_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8765/api/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
